name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/pearl-of-the-orient-backend
            git pull origin main
            npm install
            npx prisma migrate deploy
            npx prisma generate
            npm run build
            pm2 restart pearl-backend --update-env